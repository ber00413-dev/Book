<!--
Assignment Description:
Pick any book and animate its front cover using HTML/CSS using what we covered in class. This is a simple but flexible project where you will need to apply the fundamentals of web coding and be creative with how you animate the graphics in a 2D space.



Content Requirements:
1. Title, author, and primary artwork of the book cover.
2. The height of the book cover's container must be at least 700px.
3. The rest of the book's cover design may remain the same, but feel free to redesign it if you have the time/capacity to do so.
4. Your animations can either be played automatically or triggered through a hover state.



Deliverable Requirements

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>The Hunger Games</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="book-cover">

        <!-- Background circles -->
        <div class="circles"></div>

        <!-- Book title -->
        <h1>THE<br>HUNGER<br>GAMES</h1>

        <!-- Decorative flames -->
        <div class="flames">
            <div class="flame flame1"></div>
            <div class="flame flame2"></div>
            <div class="flame flame3"></div>
            <div class="flame flame4"></div>
            <div class="flame flame5"></div>
        </div>

        <!-- Mockingjay bird -->
        <div class="mockingjay">

            <div class="gold-ring"></div>

            <div class="bird">

                <div class="wing left-wing"></div>
                <div class="wing right-wing"></div>

                <div class="bird-body"></div>
                <div class="bird-head"></div>
                <div class="beak"></div>

                <div class="arrow"></div>

            </div>

        </div>

        <!-- Author -->
        <p class="author">SUZANNE COLLINS</p>

    </div>

</body>
</html>
